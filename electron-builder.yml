appId: app.sidequest.desktop
productName: ProjiSpace
directories:
  output: release
files:
  - dist/**
  - server/app.mjs
  - server/transcription.mjs
  - server/assistant.mjs
  - server/assistant-setup.mjs
  - src/translations.mjs
  - desktop/application.mjs
  - desktop/main.mjs
  - desktop/storage.mjs
  - desktop/data.mjs
  - desktop/permissions.mjs
  - desktop/assistant-runtime.mjs
  - desktop/assets/**
  - LICENSE
  - LICENSE.ru.md
  - NOTICE
  - package.json
  - "!node_modules/**/*"
asar: true
npmRebuild: false
beforePack: scripts/build-mac-whisper.mjs
win:
  extraResources:
    - from: desktop/voice
      to: voice
  target:
    - target: nsis
      arch: [x64]
  icon: desktop/assets/icon.ico
  artifactName: ProjiSpace-Installer-${version}-${arch}.${ext}
mac:
  extraResources:
    - from: "artifacts/whisper-mac/${arch}/whisper-cli"
      to: voice/whisper-cli
    - from: desktop/voice
      to: voice
      filter:
        - NOTICE.txt
        - LICENSE-*.txt
  extendInfo:
    NSMicrophoneUsageDescription: ProjiSpace uses the microphone to record speech when you start dictation.
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  icon: desktop/assets/icon.png
  identity: "-"
  entitlements: desktop/assets/entitlements.mac.plist
  entitlementsInherit: desktop/assets/entitlements.mac.plist
  notarize: false
  artifactName: ProjiSpace-${version}-macOS-${arch}.${ext}
nsis:
  license: LICENSE
  include: desktop/installer.nsh
  installerIcon: desktop/assets/icon.ico
  uninstallerIcon: desktop/assets/icon.ico
  installerLanguages: [en_US, ru_RU]
  displayLanguageSelector: true
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  runAfterFinish: false
  shortcutName: ProjiSpace
